name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hassfest and HACS rules move under a released integration, so re-run
    # weekly rather than only when something is pushed.
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Actions are pinned to a commit SHA rather than a tag: a tag is mutable, so
# `@v7` is a promise from the publisher rather than a fact about what runs.
# The trailing comment is what Dependabot reads to offer the next version -
# see .github/dependabot.yml.
permissions:
  contents: read

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinning this only pins the wrapper; the validation itself comes from
      # the ghcr.io/home-assistant/hassfest:latest image it pulls at run time,
      # so the rules still track Home Assistant core.
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          # Same version the test requirements install, so a green run here
          # means the same thing as a green `ruff check` locally. Without it
          # the action takes whatever ruff released this morning.
          version-file: requirements_test.txt
          src: >-
            custom_components
            tests
          args: check --output-format=github
      - name: Ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: requirements_test.txt
          src: >-
            custom_components
            tests
          args: format --check --diff

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components/ul_transport --cov-report=term-missing
